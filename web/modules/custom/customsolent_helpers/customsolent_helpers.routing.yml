# The automated by-topic listing pages: /{topic path}/events, /articles,
# /series, /collaborations and /organisations. Visitors never see this internal path —
# TopicListingPathProcessor maps the pretty URL in and out.
customsolent_helpers.topic_listing:
  path: '/topic-listing/{node}/{listing_type}'
  defaults:
    _controller: '\Drupal\customsolent_helpers\Controller\TopicListingController::view'
    _title_callback: '\Drupal\customsolent_helpers\Controller\TopicListingController::title'
  requirements:
    _entity_access: 'node.view'
    node: \d+
    listing_type: 'events|articles|series|collaborations|organisations'
  options:
    parameters:
      node:
        type: entity:node

# The bare URL prefixes of the new content types redirect (301) to their
# listing pages: /series -> /explore/series, /collaborations and
# /collaboration -> /explore/collaborations, /people -> /about/team.
# See ListingHomeRedirectController.
customsolent_helpers.series_home:
  path: '/series'
  defaults:
    _controller: '\Drupal\customsolent_helpers\Controller\ListingHomeRedirectController::redirectToListing'
    listing: '/explore/series'
  requirements:
    _access: 'TRUE'
customsolent_helpers.collaborations_home:
  path: '/collaborations'
  defaults:
    _controller: '\Drupal\customsolent_helpers\Controller\ListingHomeRedirectController::redirectToListing'
    listing: '/explore/collaborations'
  requirements:
    _access: 'TRUE'
customsolent_helpers.collaboration_home:
  path: '/collaboration'
  defaults:
    _controller: '\Drupal\customsolent_helpers\Controller\ListingHomeRedirectController::redirectToListing'
    listing: '/explore/collaborations'
  requirements:
    _access: 'TRUE'
customsolent_helpers.people_home:
  path: '/people'
  defaults:
    _controller: '\Drupal\customsolent_helpers\Controller\ListingHomeRedirectController::redirectToListing'
    listing: '/about/team'
  requirements:
    _access: 'TRUE'
# /link is the Link content type's URL prefix (/link/<title>, issue 444); the
# bare prefix, and /links, go to the organisations and links listing.
customsolent_helpers.link_home:
  path: '/link'
  defaults:
    _controller: '\Drupal\customsolent_helpers\Controller\ListingHomeRedirectController::redirectToListing'
    listing: '/explore/organisations'
  requirements:
    _access: 'TRUE'
customsolent_helpers.links_home:
  path: '/links'
  defaults:
    _controller: '\Drupal\customsolent_helpers\Controller\ListingHomeRedirectController::redirectToListing'
    listing: '/explore/organisations'
  requirements:
    _access: 'TRUE'

# Formats (issue 485): /explore/events/<format> lists the events of that
# shape across the three pillars, under Explore like every other listing
# (an event's own page is /events/<title>-<date>). The bare /events goes to
# the events page. No format slug is a listing word (events, articles …),
# so TopicListingPathProcessor and this route never meet.
customsolent_helpers.events_home:
  path: '/events'
  defaults:
    _controller: '\Drupal\customsolent_helpers\Controller\ListingHomeRedirectController::redirectToListing'
    listing: '/explore/events'
  requirements:
    _access: 'TRUE'
customsolent_helpers.format_listing:
  path: '/explore/events/{format}'
  defaults:
    _controller: '\Drupal\customsolent_helpers\Controller\FormatListingController::view'
    _title_callback: '\Drupal\customsolent_helpers\Controller\FormatListingController::title'
  requirements:
    _access: 'TRUE'
    format: '[a-z0-9-]+'

# Places (Location epic, issue 440): /places/<slug> is a Location term's
# page, the events there (and anywhere beneath it) and the organisations
# based there; /places is the tree. The term's own /taxonomy/term/N stays
# a 404 (rabbit hole); nothing links to it.
customsolent_helpers.place_index:
  path: '/places'
  defaults:
    _controller: '\Drupal\customsolent_helpers\Controller\PlaceController::index'
    _title: 'Places'
  requirements:
    _access: 'TRUE'
customsolent_helpers.place:
  path: '/places/{place}'
  defaults:
    _controller: '\Drupal\customsolent_helpers\Controller\PlaceController::view'
    _title_callback: '\Drupal\customsolent_helpers\Controller\PlaceController::title'
  requirements:
    _access: 'TRUE'
    place: '[a-z0-9-]+'
