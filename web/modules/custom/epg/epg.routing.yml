epg.guide:
  path: '/explore/local-radio-tv-schedules'
  defaults:
    _controller: '\Drupal\epg\Controller\EpgController::guide'
    _title: 'Local radio and TV schedules'
  requirements:
    _access: 'TRUE'
# A programme's page is /programmes/<title>-<date> (the URL pattern in
# config); the bare words go to the guide.
epg.programmes_home:
  path: '/programmes'
  defaults:
    _controller: '\Drupal\customsolent_helpers\Controller\ListingHomeRedirectController::redirectToListing'
    listing: '/explore/local-radio-tv-schedules'
  requirements:
    _access: 'TRUE'
epg.programme_home:
  path: '/programme'
  defaults:
    _controller: '\Drupal\customsolent_helpers\Controller\ListingHomeRedirectController::redirectToListing'
    listing: '/explore/local-radio-tv-schedules'
  requirements:
    _access: 'TRUE'
