      name: 'Culture / Writing / Books'
      description__value: "<p>Reading rather than writing: bookshops, book clubs and reading groups, author talks and book launches, literary and readers' festivals (Coastal Crime), libraries' reading events. A bookshop is primary here with Sectors / Retail related. Writers' groups and workshops are Culture / Writing; publishers as businesses are Sectors / Media &amp; Publishing.</p>"
      description__format: basic_html
      weight: '0'
