      name: 'Living / Community'
      description__value: "<p>Civic life, participation and support: residents' and tenants' groups, community centres and halls as places people use, volunteering, advice and support networks, councils' community programmes. Community-run cultural life (arts groups, community radio, local festivals) is Culture / Community; who people are and where they feel they belong is Culture / Identity &amp; Belonging. Test for any tag: would a reader who chose this term be glad to find it? Two yeses mean both terms; a yes and a shrug mean one.</p>"
