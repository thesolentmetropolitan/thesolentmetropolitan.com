  event_cost:
    -
      vid: event_cost
      tid: '412'
      langcode: en
      name: 'Concessions available'
      description__value: "Reduced prices for some: students, under-18s, over-60s, those on benefits. Goes with Paid; the organiser's page has the detail."
      description__format: basic_html
      weight: '3'
      parent: '0'
      uuid: 13088ab6-bb4f-4057-bfda-75ba19c21c03
    -
      vid: event_cost
      tid: '409'
      langcode: en
      name: Free
      description__value: 'No charge to go. Booking may still be needed.'
      description__format: basic_html
      weight: '0'
      parent: '0'
      uuid: 3d103d49-1a2d-48c1-859a-1a9bb2a534b1
    -
      vid: event_cost
      tid: '411'
      langcode: en
      name: Paid
      description__value: 'Tickets or an entry charge.'
      description__format: basic_html
      weight: '2'
      parent: '0'
      uuid: f844f4a2-322e-4302-9b9b-b8a2bd0a4f11
    -
      vid: event_cost
      tid: '410'
      langcode: en
      name: 'Pay what you can'
      description__value: 'Pay what you feel or can afford, with a suggested amount at most; nobody turned away.'
      description__format: basic_html
      weight: '1'
      parent: '0'
      uuid: a002ad73-b1c3-4dd0-86e2-f58f868003dc
  format:
    -
      vid: format
      tid: '404'
      langcode: en
      name: Broadcast
      description__value: "<p>Things you listen to or watch rather than attend: radio shows and stations' programmes, podcasts, TV programmes, live streams. An event that is also streamed keeps its own format with the Setting Online or Hybrid.</p>"
      description__format: basic_html
      weight: '15'
      parent: '0'
      uuid: 3c970a69-a632-476f-b4d0-ce9ce9823d84
      field_plural_label:
        -
          value: Broadcasts
      field_reader_summary:
        -
          value: 'Radio shows, podcasts, TV programmes and live streams.'
    -
      vid: format
      tid: '398'
      langcode: en
      name: 'Class & Course'
      description__value: '<p>Teaching that repeats or runs to a syllabus: dance and language classes, choirs you join to learn, evening courses, bootcamps. Add Drop-in when you can turn up to any one session without committing to the run; leave it off a course you sign up to. A single hands-on session is Workshop.</p>'
      description__format: basic_html
      weight: '8'
      parent: '0'
      uuid: 97298708-8bb1-497d-8776-cfbdbc842a2c
      field_plural_label:
        -
          value: 'Classes & Courses'
      field_reader_summary:
        -
          value: 'Regular classes and courses: weekly lessons, night school, terms and bootcamps.'
    -
      vid: format
      tid: '391'
      langcode: en
      name: 'Club Night & Party'
      description__value: '<p>Club nights, DJ sets, parties and dances where the point is the dancefloor: house nights, salsa socials, silent discos, a Halloween party. A live act to an audience is Performance; a dance lesson is Class &amp; Course, and the social dancing after a class is Class &amp; Course plus Social &amp; Meet-up, not a club night.</p>'
      description__format: basic_html
      weight: '1'
      parent: '0'
      uuid: 03758fdc-1ca3-43e8-a52c-38c6d0bab809
      field_plural_label:
        -
          value: 'Club Nights & Parties'
      field_reader_summary:
        -
          value: 'Club nights, DJ sets, parties and socials where the dancefloor is the point.'
    -
      vid: format
      tid: '399'
      langcode: en
      name: Conference
      description__value: '<p>A day or more of talks, panels and stands for a profession or industry: business shows, tech and music-industry conferences, trade exhibitions. A single talk is Talk; a public exhibition of work is Exhibition.</p>'
      description__format: basic_html
      weight: '9'
      parent: '0'
      uuid: c6ea2c2b-4547-4902-a452-3be705f2f5e8
      field_plural_label:
        -
          value: Conferences
      field_reader_summary:
        -
          value: 'Conferences, summits and trade shows for a sector.'
    -
      vid: format
      tid: '406'
      langcode: en
      name: Drop-in
      description__value: "<p>A modifier: you can just turn up to a single session with no booking and no commitment to a run. Sits beside the format it modifies (a drop-in dance class is Class &amp; Course + Drop-in; a taster lesson likewise; a repair café's open afternoon is Workshop + Drop-in) and stands alone for an advice or support drop-in. Leave it off a course you sign up to for the run, and off anything ticketed in advance.</p>"
      description__format: basic_html
      weight: '16'
      parent: '0'
      uuid: 261c3194-38d3-4053-ad73-504bd2135a8e
      field_plural_label:
        -
          value: Drop-ins
      field_reader_summary:
        -
          value: 'Turn up when you like: no booking, no commitment to a run of sessions.'
    -
      vid: format
      tid: '394'
      langcode: en
      name: Exhibition
      description__value: '<p>Art, photography and museum exhibitions, degree shows, open studios, displays that run for days or weeks. A trade show for an industry is Conference; a one-day sale of work is Market &amp; Fair.</p>'
      description__format: basic_html
      weight: '4'
      parent: '0'
      uuid: b62f856d-a271-4499-a571-1b0ddb749103
      field_plural_label:
        -
          value: Exhibitions
      field_reader_summary:
        -
          value: 'Exhibitions and shows of work on display, running for days or weeks.'
    -
      vid: format
      tid: '392'
      langcode: en
      name: Festival
      description__value: "<p>A programme of many events under one name, usually one weekend or season: music festivals, fringes, food festivals, a town's big weekend. Tag the festival itself; its individual events take their own format and belong to the festival as a Series.</p>"
      description__format: basic_html
      weight: '2'
      parent: '0'
      uuid: 014911ff-fc67-4d55-ad68-38200674fdbf
      field_plural_label:
        -
          value: Festivals
      field_reader_summary:
        -
          value: 'Festivals: many events under one name, usually over a weekend or a season.'
    -
      vid: format
      tid: '407'
      langcode: en
      name: Fundraiser
      description__value: '<p>A modifier: the event raises money for a cause, whatever its shape. Sits beside the format of the thing itself (a charity rave is Club Night &amp; Party + Fundraiser; a sponsored run is Fundraiser with its sport in Topic; a charity quiz is Social &amp; Meet-up + Fundraiser). Not for a ticketed event that merely covers its costs.</p>'
      description__format: basic_html
      weight: '17'
      parent: '0'
      uuid: afe7b1a3-9239-4b4f-9176-59967ce36a04
      field_plural_label:
        -
          value: Fundraisers
      field_reader_summary:
        -
          value: 'Raising money for a cause: sponsored runs and walks, charity gigs, quizzes and raves.'
    -
      vid: format
      tid: '402'
      langcode: en
      name: 'Guided Tour'
      description__value: "<p>Tours and trails with a guide: heritage and ghost tours, bus and boat tours, guided nature hikes, taster tours, open-studio trails. On foot, wheels or water, so the word is Tour, not Walk. A group that walks for the company is Social &amp; Meet-up; a band's tour is a Performance.</p>"
      description__format: basic_html
      weight: '13'
      parent: '0'
      uuid: 75b29d3b-d1cc-48dd-8bb2-2c8632ec4bb3
      field_plural_label:
        -
          value: 'Guided Tours'
      field_reader_summary:
        -
          value: 'Guided tours and trails: someone leads you round, on foot, wheels or water.'
    -
      vid: format
      tid: '408'
      langcode: en
      name: Launch
      description__value: "<p>A modifier: the event is the opening of something, an exhibition's launch night, a book or magazine launch, a season or venue opening. Sits beside the shape of the night (Exhibition + Launch, Performance + Launch). The thing it opens is its own item with its own run of dates.</p>"
      description__format: basic_html
      weight: '18'
      parent: '0'
      uuid: 382be625-3ecb-4588-a866-0a7ed2a91cc8
      field_plural_label:
        -
          value: Launches
      field_reader_summary:
        -
          value: 'Opening nights and launches: the first night of something that then runs.'
    -
      vid: format
      tid: '393'
      langcode: en
      name: 'Market & Fair'
      description__value: "<p>Street and makers' markets, craft and record fairs, car-boot and jumble sales, Christmas markets, careers and jobs fairs. A trade show for an industry is Conference; work on display rather than for sale is Exhibition.</p>"
      description__format: basic_html
      weight: '3'
      parent: '0'
      uuid: 72eeb2ce-b78f-4e91-af2a-725c10ca211e
      field_plural_label:
        -
          value: 'Markets & Fairs'
      field_reader_summary:
        -
          value: 'Markets, fairs and sales: stalls to browse and buy from.'
    -
      vid: format
      tid: '400'
      langcode: en
      name: Networking
      description__value: '<p>Events whose point is meeting people in a trade or scene: business breakfasts, creative networking, meet-ups for an industry. A friendly gathering with no trade angle is Social &amp; Meet-up.</p>'
      description__format: basic_html
      weight: '10'
      parent: '0'
      uuid: 06c9b41c-5318-4e5b-a5c6-181eeca31b71
      field_plural_label:
        -
          value: Networking
      field_reader_summary:
        -
          value: 'Networking events, business breakfasts and meet-the-scene nights.'
    -
      vid: format
      tid: '403'
      langcode: en
      name: 'Open Mic & Jam'
      description__value: '<p>Nights where the bill is whoever turns up: music, poetry and comedy open mics, jam sessions, singarounds, electronic jams. The subject stays in Topic (Open Mic &amp; Spoken Word, a music genre, Comedy).</p>'
      description__format: basic_html
      weight: '14'
      parent: '0'
      uuid: 31385f38-205c-4632-93b4-7b9279684543
      field_plural_label:
        -
          value: 'Open Mics & Jams'
      field_reader_summary:
        -
          value: 'Open mics, jams and sessions where anyone can get up.'
    -
      vid: format
      tid: '390'
      langcode: en
      name: Performance
      description__value: '<p>Anything performed to an audience: gigs and concerts, theatre and musicals, comedy nights, dance performances, cabaret, pantomime. A night where anyone can get up is Open Mic &amp; Jam; a DJ night is Club Night &amp; Party; a programme of many performances is Festival.</p>'
      description__format: basic_html
      weight: '0'
      parent: '0'
      uuid: 3c9f7188-02d8-40f4-b5a8-fc393173a620
      field_plural_label:
        -
          value: Performances
      field_reader_summary:
        -
          value: 'Gigs, shows and concerts: music, theatre, comedy and dance performed to an audience.'
    -
      vid: format
      tid: '405'
      langcode: en
      name: 'Public Meeting'
      description__value: "<p>Meetings open to the public about shared concerns: police and community meetings, residents' and tenants' meetings, community assemblies, council consultations, hustings, AGMs. People come to raise and settle things, not for the company (Social &amp; Meet-up) or to hear an expert (Talk).</p>"
      description__format: basic_html
      weight: '12'
      parent: '0'
      uuid: d8e6985d-0872-4218-b96b-0388dfcf31e0
      field_plural_label:
        -
          value: 'Public Meetings'
      field_reader_summary:
        -
          value: 'Public meetings, assemblies and consultations: come to be heard and to hear.'
    -
      vid: format
      tid: '395'
      langcode: en
      name: Screening
      description__value: '<p>Films, documentaries and shorts shown to an audience, with or without a talk or discussion after. A film festival is Festival, with Screening on its individual events.</p>'
      description__format: basic_html
      weight: '5'
      parent: '0'
      uuid: 322f95f5-c71c-4ffb-8ae6-6323e70423ac
      field_plural_label:
        -
          value: Screenings
      field_reader_summary:
        -
          value: 'Film screenings, with or without a discussion after.'
    -
      vid: format
      tid: '401'
      langcode: en
      name: 'Social & Meet-up'
      description__value: "<p>Gatherings you turn up to for the company and the shared interest: coffee mornings, peer support groups, hobby clubs' regular meets, community assemblies, quiz nights, the social dancing after a dance class. Networking for work is Networking; a night that exists for the dancefloor is Club Night &amp; Party.</p>"
      description__format: basic_html
      weight: '11'
      parent: '0'
      uuid: a0dcb4f4-0fe8-4422-9f60-a42b864ec896
      field_plural_label:
        -
          value: 'Socials & Meet-ups'
      field_reader_summary:
        -
          value: 'Socials, meet-ups, clubs and support groups: come along and meet people.'
    -
      vid: format
      tid: '396'
      langcode: en
      name: Talk
      description__value: '<p>Talks, lectures, panels, Q&amp;As, seminars, TEDx events, café-science evenings, author events and readings. Online or in a room is the Setting, not the format. A hands-on session is Workshop; a day of talks for a sector is Conference.</p>'
      description__format: basic_html
      weight: '6'
      parent: '0'
      uuid: 701aa039-ac68-4cf7-9191-15b4913b415a
      field_plural_label:
        -
          value: Talks
      field_reader_summary:
        -
          value: 'Talks, lectures, panels and seminars: someone speaks, you listen and ask.'
    -
      vid: format
      tid: '397'
      langcode: en
      name: Workshop
      description__value: '<p>A one-off (or short) session where you do the thing: a drawing workshop, a zine workshop, a repair café, a coding dojo, a masterclass. Teaching that runs weekly or as a course is Class &amp; Course; listening to an expert is Talk.</p>'
      description__format: basic_html
      weight: '7'
      parent: '0'
      uuid: 1d744142-1757-4ec8-a7ea-3c378c22b35a
      field_plural_label:
        -
          value: Workshops
      field_reader_summary:
        -
          value: 'Hands-on sessions where you make, try or learn by doing.'
  location:
    -
      vid: location
