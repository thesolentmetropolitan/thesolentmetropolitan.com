      langcode: en
      name: 'Culture / Music / Rock'
      description__value: '<p>Rock as a broad guitar genre: classic rock, blues rock, prog, psych, tribute acts, covers bands. Indie and alternative are Indie; heavy music is Metal; punk is Punk.</p>'
