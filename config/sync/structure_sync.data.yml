      name: 'Culture / Writing / Poetry'
      description__value: '<p>The poets and the writing: poetry collectives and groups, small presses and pamphlets, workshops on writing poetry, poetry as a subject. Poetry nights, slams and open mics are Culture / Stage / Open Mic &amp; Spoken Word with Poetry as a related topic, and so are the groups that exist to run a night (Pompey Poetry Party, Southsea Arts Poetry Collective). Replace a bare Culture / Writing tag with Poetry; it sits under Writing, so the item still shows there.</p>'
      description__format: basic_html
      weight: '0'
