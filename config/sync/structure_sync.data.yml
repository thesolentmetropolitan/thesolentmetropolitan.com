      name: 'Culture / Writing'
      description__value: "<p>The written word as something people make: writers' circles and societies, creative-writing workshops and courses, zines and independent magazines as writing, blogging. Its sub-terms take the item when they fit: Poetry (the poets and the writing) and Books (the reading side: bookshops, book clubs, author events, literary festivals). Poetry and spoken-word nights are Culture / Stage / Open Mic &amp; Spoken Word; publishers and magazines as businesses are Sectors / Media &amp; Publishing. Fiction is not yet a term: a fiction-specific group or festival stays here until there are two.</p>"
      description__format: basic_html
      weight: '22'
