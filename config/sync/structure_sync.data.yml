    -
      vid: topic
      tid: '183'
      langcode: en
      name: 'Culture / Art & Design / Crafts'
      description__value: '<p>Craft as a subject: textiles, ceramics, print, woodwork and the studios, hubs and groups that make and teach them. Culture / Workshops is a format tag and goes in related topics when the thing is a class or session.</p>'
      description__format: basic_html
      weight: '1'
      parent: '34'
      uuid: b7830886-bccd-49d0-bdb7-99d0ffb2c307
      field_reader_summary:
        -
          value: 'Making by hand: textiles, ceramics, print and the studios and groups that teach them.'
    -
      vid: topic
      tid: '35'
      langcode: en
      name: 'Culture / Community'
      description__value: "<p>Community-run cultural life that is not defined by who its members are: community centres' arts and social programmes, community arts groups, local festivals and fêtes, community radio such as Unity 101. Civic participation and support is Living / Community; heritage, ancestry, place and newcomer communities are Culture / Identity &amp; Belonging. Test for any tag: would a reader who chose this term be glad to find it? Two yeses mean both terms (the WI, Unity 101); a yes and a shrug mean one.</p>"
      description__format: basic_html
      weight: '1'
      parent: '29'
      uuid: db7aea04-812c-4419-9150-69d2dd5ff7cb
      field_reader_summary:
        -
          value: 'Neighbourhood groups, local initiatives and the people building community life across the Solent.'
    -
