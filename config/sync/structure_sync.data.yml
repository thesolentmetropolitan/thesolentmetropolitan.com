    -
      vid: topic
      tid: '44'
      langcode: en
      name: 'Culture / Music'
      description__value: '<p>Tag the genre when there is one: the genre term is the primary topic (it sits under Music, so the item still shows here). Music itself stays primary for the industry and its infrastructure (venues, studios, labels, radio shows, conferences, guides, tuition, youth music charities) and for multi-genre things, which name their genres as related topics. Choirs, jams and open mics take their genre when they have one (a soul choir is Funk &amp; Soul), else Music.</p>'
      description__format: basic_html
      weight: '11'
      parent: '29'
      uuid: aa8ba975-81bc-40a7-83d6-4a174b2a917c
      field_reader_summary:
        -
          value: "Gigs, venues, festivals and the musicians making up the Solent's music scene."
    -
      vid: topic
      tid: '377'
      langcode: en
      name: 'Culture / Music / Afrobeats'
      description__value: '<p>Afrobeats in the current sense (Nigerian and Ghanaian pop and the UK scene around it), amapiano, Afro-fusion, Afroswing, plus the 1970s Afrobeat of Fela Kuti and the bands that carry it on. A night that mixes afrobeats with R&amp;B and hip hop takes Afrobeats when it leads the billing, else R&amp;B. Traditional and folk music from Africa is World.</p>'
      description__format: basic_html
      weight: '0'
      parent: '44'
      uuid: a00af7fc-23bd-413c-9d79-44b07c4e2006
      field_reader_summary:
        -
          value: 'Afrobeats, amapiano and Afro-fusion nights, DJs and artists across the Solent.'
    -
      vid: topic
      tid: '349'
      langcode: en
      name: 'Culture / Music / Ambient & Experimental'
      description__value: '<p>Music made to be listened to rather than danced to: ambient, drone, noise, sound art, modular and live-coding sets, improvised electronics. Dance-floor styles take their own term.</p>'
      description__format: basic_html
      weight: '0'
      parent: '44'
      uuid: 8d72517c-38fa-4d74-bcb9-3920db7c65c6
      field_reader_summary:
        -
          value: 'Ambient, drone, sound art and experimental electronics: listening music and the people making it around the Solent.'
    -
      vid: topic
      tid: '350'
      langcode: en
      name: 'Culture / Music / Bassline'
      description__value: '<p>Bassline (4x4, niche) nights and DJs: a UK style in its own right. Use UK Garage or House when the night says so instead.</p>'
      description__format: basic_html
      weight: '0'
      parent: '44'
      uuid: 7cb10a10-dd68-4bcc-b713-39cb6f55b51b
      field_reader_summary:
        -
          value: 'Bassline and 4x4 garage nights and DJs across the Solent.'
    -
      vid: topic
      tid: '351'
      langcode: en
      name: 'Culture / Music / Blues'
      description__value: '<p>Blues and blues rock: gigs, jam nights, blues clubs. Rhythm and blues in the modern sense is R&amp;B; soul is Funk &amp; Soul.</p>'
      description__format: basic_html
      weight: '0'
      parent: '44'
      uuid: 1807d433-0b6c-4fae-aeae-ced4838e4038
      field_reader_summary:
        -
          value: 'Blues gigs, jam nights and clubs around the Solent.'
    -
      vid: topic
      tid: '352'
      langcode: en
      name: 'Culture / Music / Classical'
      description__value: "<p>Orchestral, chamber, choral and contemporary classical music, opera, early music: the orchestras, choral societies, ensembles, concert series and the venues' classical programmes. Community choirs singing pop and soul take their genre instead.</p>"
      description__format: basic_html
      weight: '0'
      parent: '44'
      uuid: 09bed464-bf28-431d-983c-a59efd8ee9d9
      field_reader_summary:
        -
          value: 'Orchestras, choirs, chamber music, opera and classical concerts across the Solent.'
    -
      vid: topic
      tid: '353'
      langcode: en
      name: 'Culture / Music / Country & Americana'
      description__value: '<p>Country, Americana, bluegrass, alt-country and roots rock. Traditional British and Irish folk is Folk.</p>'
      description__format: basic_html
      weight: '0'
      parent: '44'
      uuid: b1850edc-0d40-4541-9f6e-8b5324548e88
      field_reader_summary:
        -
          value: 'Country, Americana, bluegrass and roots-rock nights around the Solent.'
    -
      vid: topic
      tid: '354'
      langcode: en
      name: 'Culture / Music / Disco'
      description__value: '<p>Disco, boogie, Italo and nu-disco nights, all-dayers and DJs. Soul and funk nights that are not about the dance floor are Funk &amp; Soul; house is House.</p>'
      description__format: basic_html
      weight: '0'
      parent: '44'
      uuid: e152b45d-192a-4bbd-b89c-a413ee49110a
      field_reader_summary:
        -
          value: 'Disco, boogie and nu-disco parties and all-dayers around the Solent.'
    -
      vid: topic
      tid: '355'
      langcode: en
      name: 'Culture / Music / Drum & Bass'
      description__value: '<p>Drum &amp; bass in all its forms: liquid, jump-up, neurofunk, halftime. Jungle has its own term for the nights and crews that call themselves jungle; a night that says both takes both.</p>'
      description__format: basic_html
      weight: '0'
      parent: '44'
      uuid: 6f0828a1-9eb9-4446-940c-766bc6ba146a
      field_reader_summary:
        -
          value: 'Drum & bass nights, crews, producers and DJs across the Solent.'
    -
      vid: topic
      tid: '356'
      langcode: en
      name: 'Culture / Music / Dubstep'
      description__value: '<p>Dubstep and the 140 bass-music scene around it (deep dubstep, UK bass, riddim). Reggae sound systems are Reggae; grime is Grime.</p>'
      description__format: basic_html
      weight: '0'
      parent: '44'
      uuid: b15329be-c93a-4896-8a28-d54b55df8fc3
      field_reader_summary:
        -
          value: 'Dubstep, 140 and bass-music nights and producers around the Solent.'
    -
      vid: topic
      tid: '357'
      langcode: en
      name: 'Culture / Music / Electronic'
      description__value: '<p>The broad term for electronic and dance music. Primary for things that span styles or name none (an electronic jam, a scene guide, a multi-room rave, a producer meet-up). Related alongside the specific style when a night clearly belongs to one scene but readers browsing Electronic would want it too. Not needed on a single-style night: its own term is enough.</p>'
      description__format: basic_html
      weight: '0'
      parent: '44'
      uuid: f32d7f52-e6f5-4de3-9d5a-04963626a629
      field_reader_summary:
        -
          value: 'Electronic and dance music of every kind across the Solent: nights, collectives, producers and the scene around them.'
    -
      vid: topic
      tid: '358'
      langcode: en
      name: 'Culture / Music / Folk'
      description__value: '<p>Traditional and contemporary folk: folk clubs, sessions, singer-songwriters in the folk tradition, sea shanties, ceilidh bands. Country and Americana have their own term; music from other traditions is World.</p>'
      description__format: basic_html
      weight: '0'
      parent: '44'
      uuid: 773108bd-3aa5-4e62-91c9-8469030758d7
      field_reader_summary:
        -
          value: 'Folk clubs, sessions, shanty crews and singer-songwriters across the Solent.'
    -
      vid: topic
      tid: '359'
      langcode: en
      name: 'Culture / Music / Funk & Soul'
      description__value: '<p>Soul, funk, Motown, northern soul, rare groove and the choirs and bands that sing them. Contemporary R&amp;B is R&amp;B; disco nights are Disco.</p>'
      description__format: basic_html
      weight: '0'
      parent: '44'
      uuid: 72639b3f-c620-4feb-8518-204058ed476d
      field_reader_summary:
        -
          value: 'Soul, funk, Motown and northern soul nights, bands and choirs around the Solent.'
    -
      vid: topic
      tid: '360'
      langcode: en
      name: 'Culture / Music / Grime'
      description__value: '<p>Grime and UK drill: MCs, producers, sets, clashes, radio shows. Rap in the wider sense is Hip Hop; the 140 instrumental side is Dubstep.</p>'
      description__format: basic_html
      weight: '0'
      parent: '44'
      uuid: f2620c28-7e8d-4081-ba85-bef2008c16a2
      field_reader_summary:
        -
          value: 'Grime and UK drill MCs, producers, sets and clashes around the Solent.'
    -
      vid: topic
      tid: '361'
      langcode: en
      name: 'Culture / Music / Hip Hop'
      description__value: '<p>Hip hop and rap: gigs, cyphers, open mics, beat-making and rap workshops, crews, record labels. Grime and drill have their own term; soul and funk are Funk &amp; Soul.</p>'
      description__format: basic_html
      weight: '0'
      parent: '44'
      uuid: ae9f0aa5-da7c-47d0-85ea-697b123f2999
      field_reader_summary:
        -
          value: 'Hip hop and rap gigs, cyphers, workshops, crews and labels across the Solent.'
    -
      vid: topic
      tid: '362'
      langcode: en
      name: 'Culture / Music / House'
      description__value: '<p>House in all its forms: deep, tech, soulful, garage-house, disco-house. UK Garage and Bassline have their own terms; techno is Techno.</p>'
      description__format: basic_html
      weight: '0'
      parent: '44'
      uuid: eb99505c-ad31-414a-b8f3-4363cbd639a5
      field_reader_summary:
        -
          value: 'House music nights, DJs, collectives and labels across the Solent.'
    -
      vid: topic
      tid: '363'
      langcode: en
      name: 'Culture / Music / Indie'
      description__value: '<p>Indie and alternative guitar music, Britpop and new wave included: bands, gigs, independent labels, zines and blogs about them. Heavier bands are Metal; punk and post-punk are Punk; classic and heritage rock is Rock.</p>'
      description__format: basic_html
      weight: '0'
      parent: '44'
      uuid: 36c7a55f-345d-41c2-b0d7-0dd425648f71
      field_reader_summary:
        -
          value: 'Indie and alternative bands, gigs, labels, zines and blogs across the Solent.'
    -
      vid: topic
      tid: '364'
      langcode: en
      name: 'Culture / Music / Jazz'
      description__value: '<p>Jazz in all its forms: clubs, concert series, jam sessions, big bands, swing, fusion and jazz-adjacent improvised music. Blues is Blues; soul is Funk &amp; Soul.</p>'
      description__format: basic_html
      weight: '0'
      parent: '44'
      uuid: d69ef295-f10b-4e6e-a393-7749a29043c4
      field_reader_summary:
        -
          value: 'Jazz clubs, gigs, jam sessions and big bands across the Solent.'
    -
      vid: topic
      tid: '365'
      langcode: en
      name: 'Culture / Music / Jungle'
      description__value: '<p>Jungle: ragga jungle, old-skool and new jungle, the nights and crews that call it by that name. Drum &amp; Bass is the sibling term; a night that says both takes both.</p>'
      description__format: basic_html
      weight: '0'
      parent: '44'
      uuid: 006eaeef-ae2b-4b40-91af-b76ee9ecb1c2
      field_reader_summary:
        -
          value: 'Jungle nights, crews and sound systems around the Solent.'
    -
      vid: topic
      tid: '366'
      langcode: en
      name: 'Culture / Music / Metal'
      description__value: '<p>Metal and heavy music: doom, death, thrash, metalcore, hardcore, stoner, prog metal. Punk is Punk; indie and alternative guitar music is Indie.</p>'
      description__format: basic_html
      weight: '0'
      parent: '44'
      uuid: 316cc3d1-ad2f-47e8-8f5b-f95ee39eb56f
      field_reader_summary:
        -
          value: 'Metal and heavy music gigs, bands, all-dayers and promoters across the Solent.'
    -
      vid: topic
      tid: '367'
      langcode: en
      name: 'Culture / Music / Pop'
      description__value: '<p>Pop in the chart sense: pop acts, K-pop and J-pop events, tribute and party nights built on pop. Pop choirs take Funk &amp; Soul or Classical when that fits better, else Pop.</p>'
      description__format: basic_html
      weight: '0'
      parent: '44'
      uuid: 8723b921-31dc-42b7-8ad0-9b0bf74a7bf6
      field_reader_summary:
        -
          value: 'Pop, K-pop and chart music events, acts and party nights around the Solent.'
    -
      vid: topic
      tid: '368'
      langcode: en
      name: 'Culture / Music / Punk'
      description__value: '<p>Punk, post-punk, hardcore punk, ska-punk and the DIY scene around them. Ska and 2 Tone are Ska; metal and metalcore are Metal.</p>'
      description__format: basic_html
      weight: '0'
      parent: '44'
      uuid: ed020cc2-ef7b-40e0-8f62-4a8663ed1d24
      field_reader_summary:
        -
          value: 'Punk, hardcore and DIY gigs, bands and collectives around the Solent.'
    -
      vid: topic
      tid: '369'
      langcode: en
      name: 'Culture / Music / R&B'
      description__value: '<p>Contemporary R&amp;B and neo-soul: singers, showcases, R&amp;B nights. Parties led by afrobeats are Afrobeats; classic soul and funk are Funk &amp; Soul; rap is Hip Hop.</p>'
      description__format: basic_html
      weight: '0'
      parent: '44'
      uuid: bf30d306-f1c1-43bd-916a-e8e2e0d51166
      field_reader_summary:
        -
          value: 'R&B and neo-soul singers, showcases and nights around the Solent.'
    -
      vid: topic
      tid: '370'
      langcode: en
      name: 'Culture / Music / Reggae & Dancehall'
      description__value: '<p>Reggae and dancehall together: roots, dub, lovers rock, ragga, bashment and the sound systems, bands and DJs that play them. Ska and 2 Tone are Ska; dubstep is Dubstep; parties led by afrobeats are Afrobeats.</p>'
      description__format: basic_html
      weight: '0'
      parent: '44'
      uuid: 8a4fcfb0-5c87-4337-8fe5-2712c876f3c3
