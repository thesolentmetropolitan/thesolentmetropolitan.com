label: 'Listing mode'
description: 'Leave as "- None -" for the automatic behaviour: events show a preview of up to 8 cards; organisations and links show a signpost (a count and a link), because the first eight of an A–Z list mean nothing. Choose Preview for organisations only when the ones shown are meaningful — a sponsors row, or who has joined a cause. Choose Full listing only on a page whose whole purpose is this one list.'
